<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/><stop offset="1" stop-color="#090c16"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9bff"/><stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <radialGradient id="live" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#e5121f"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- program monitor ring -->
  <circle cx="512" cy="530" r="320" fill="none" stroke="url(#ring)" stroke-width="56"/>
  <!-- play / program triangle -->
  <path d="M430 372 L430 688 Q430 716 454 702 L704 560 Q728 546 704 532 L454 358 Q430 344 430 372 Z" fill="#ffffff"/>
  <!-- LIVE tally dot -->
  <circle cx="790" cy="236" r="104" fill="#090c16"/>
  <circle cx="790" cy="236" r="78" fill="url(#live)"/>
</svg>
