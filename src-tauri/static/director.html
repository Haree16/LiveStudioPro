<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveStudio Pro — Remote Director</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #131b2e; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .brand { font-weight: 700; font-size: 1.1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .role-tag { background: #334155; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
    .workspace { flex: 1; display: grid; grid-template-columns: 2fr 1fr; gap: 16px; padding: 16px; min-height: 0; }
    @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; overflow-y: auto; } }
    .monitors { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 260px; }
    .monitor-box { background: #020617; border-radius: 8px; border: 2px solid #334155; position: relative; display: flex; align-items: center; justify-content: center; }
    .monitor-box.pvw { border-color: #22c55e; }
    .monitor-box.pgm { border-color: #ef4444; }
    .monitor-tag { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
    .tag-pvw { background: #22c55e; color: #052e16; }
    .tag-pgm { background: #ef4444; color: white; }
    .switcher-panel { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .btn-row { display: flex; gap: 12px; }
    button { background: #1e293b; color: white; border: 1px solid #334155; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; flex: 1; transition: 0.15s ease; text-transform: uppercase; }
    button:hover { background: #334155; }
    button.btn-cut { background: #b91c1c; border-color: #dc2626; }
    button.btn-cut:hover { background: #dc2626; }
    button.btn-auto { background: #0369a1; border-color: #0284c7; }
    button.btn-auto:hover { background: #0284c7; }
    .input-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .input-btn { padding: 14px 8px; font-size: 0.85rem; border-radius: 6px; border: 2px solid #334155; background: #1e293b; text-align: center; }
    .input-btn.pvw { border-color: #22c55e; background: #064e3b; }
    .input-btn.pgm { border-color: #ef4444; background: #7f1d1d; }
    .side-panel { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .ptz-dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 220px; margin: 0 auto; }
    .ptz-btn { padding: 14px 0; font-size: 1.1rem; }
    .auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .auth-box { background: #1e293b; padding: 28px; border-radius: 12px; border: 1px solid #475569; width: 360px; display: flex; flex-direction: column; gap: 16px; }
    input[type="text"] { background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; font-size: 1rem; outline: none; }
  </style>
</head>
<body>
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <h3 style="color:#38bdf8">Director Authentication</h3>
      <p style="font-size:0.85rem; color:#94a3b8">Enter your Operator or Admin access token to control the production.</p>
      <input type="text" id="tokenInput" placeholder="Access token..." value="operator" />
      <button class="btn-auto" id="btnAuth">Connect</button>
      <div id="authError" style="color:#ef4444; font-size:0.85rem; display:none;"></div>
    </div>
  </div>

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      LiveStudio Pro Director
    </div>
    <div style="display:flex; align-items:center; gap: 12px;">
      <span class="role-tag" id="roleTag">Viewer</span>
      <span id="connStatus" style="font-size:0.8rem; color:#22c55e;">Connected</span>
    </div>
  </header>

  <div class="workspace">
    <div style="display:flex; flex-direction:column; gap: 16px;">
      <div class="monitors">
        <div class="monitor-box pvw">
          <div class="monitor-tag tag-pvw">PREVIEW</div>
          <div id="pvwLabel" style="font-size:1.2rem; font-weight:700; color:#94a3b8">CAM 1</div>
        </div>
        <div class="monitor-box pgm">
          <div class="monitor-tag tag-pgm">PROGRAM</div>
          <div id="pgmLabel" style="font-size:1.2rem; font-weight:700; color:#ef4444">CAM 2</div>
        </div>
      </div>

      <div class="switcher-panel">
        <div class="btn-row">
          <button class="btn-cut" id="btnCut">CUT</button>
          <button class="btn-auto" id="btnAuto">AUTO (0.5s)</button>
        </div>
        <div>
          <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:8px; font-weight:600">INPUT BUS (CLICK: PVW | SHIFT+CLICK: PGM)</div>
          <div class="input-grid" id="inputGrid">
            <button class="input-btn pvw" onclick="selectInput('cam1')">CAM 1</button>
            <button class="input-btn pgm" onclick="selectInput('cam2')">CAM 2</button>
            <button class="input-btn" onclick="selectInput('cam3')">GUEST 1</button>
            <button class="input-btn" onclick="selectInput('media1')">VIDEO</button>
          </div>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <h4 style="color:#94a3b8; font-size:0.9rem;">PTZ CAMERA D-PAD</h4>
      <div class="ptz-dpad">
        <button class="ptz-btn" onclick="sendPtz('UpLeft')">↖</button>
        <button class="ptz-btn" onclick="sendPtz('Up')">↑</button>
        <button class="ptz-btn" onclick="sendPtz('UpRight')">↗</button>
        <button class="ptz-btn" onclick="sendPtz('Left')">←</button>
        <button class="ptz-btn" onclick="sendPtz('Stop')">■</button>
        <button class="ptz-btn" onclick="sendPtz('Right')">→</button>
        <button class="ptz-btn" onclick="sendPtz('DownLeft')">↙</button>
        <button class="ptz-btn" onclick="sendPtz('Down')">↓</button>
        <button class="ptz-btn" onclick="sendPtz('DownRight')">↘</button>
      </div>
      <div class="btn-row">
        <button onclick="sendPtz('ZoomIn')">ZOOM +</button>
        <button onclick="sendPtz('ZoomOut')">ZOOM -</button>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let currentPvw = 'cam1';
    let currentPgm = 'cam2';

    function connectWs() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${window.location.host}/ws/director`);

      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'authSuccess') {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('roleTag').textContent = msg.role;
        } else if (msg.type === 'authFailed') {
          document.getElementById('authError').textContent = msg.error;
          document.getElementById('authError').style.display = 'block';
        }
      };
    }

    document.getElementById('btnAuth').addEventListener('click', () => {
      const token = document.getElementById('tokenInput').value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'auth', token }));
      }
    });

    document.getElementById('btnCut').addEventListener('click', () => {
      if (ws) ws.send(JSON.stringify({ action: 'cut' }));
      const temp = currentPvw;
      currentPvw = currentPgm;
      currentPgm = temp;
      updateDisplay();
    });

    document.getElementById('btnAuto').addEventListener('click', () => {
      if (ws) ws.send(JSON.stringify({ action: 'auto', durationMs: 500, transition: 'fade' }));
      const temp = currentPvw;
      currentPvw = currentPgm;
      currentPgm = temp;
      updateDisplay();
    });

    function selectInput(id) {
      currentPvw = id;
      if (ws) ws.send(JSON.stringify({ action: 'setPreview', inputId: id }));
      updateDisplay();
    }

    function sendPtz(dir) {
      if (ws) ws.send(JSON.stringify({ action: 'ptz_drive', direction: dir, panSpeed: 8, tiltSpeed: 8 }));
    }

    function updateDisplay() {
      document.getElementById('pvwLabel').textContent = currentPvw.toUpperCase();
      document.getElementById('pgmLabel').textContent = currentPgm.toUpperCase();
    }

    connectWs();
  </script>
</body>
</html>
