<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveStudio Pro — Guest Contribution</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .brand { font-weight: 700; font-size: 1.1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .badge { background: #059669; color: white; padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .main-stage { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; min-height: 0; }
    @media (max-width: 768px) { .main-stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .card-title { padding: 10px 16px; font-size: 0.85rem; font-weight: 600; color: #94a3b8; border-bottom: 1px solid #334155; background: #1e293b; z-index: 10; }
    .video-wrapper { flex: 1; background: #020617; display: flex; align-items: center; justify-content: center; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .tally-tag { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .stats-overlay { position: absolute; bottom: 12px; left: 12px; background: rgba(15,23,42,0.85); backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; color: #cbd5e1; font-family: monospace; }
    footer { background: #1e293b; padding: 14px 20px; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .controls { display: flex; gap: 12px; align-items: center; }
    button { background: #334155; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    button:hover { background: #475569; }
    button.active { background: #dc2626; }
    button.primary { background: #0284c7; }
    button.primary:hover { background: #0369a1; }
    select { background: #334155; color: white; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      LiveStudio Pro
    </div>
    <div style="display:flex; align-items:center; gap: 12px;">
      <span style="font-size: 0.9rem; color: #94a3b8;">Guest: <strong>{{GUEST_NAME}}</strong> ({{GUEST_ROLE}})</span>
      <span class="badge" id="status-badge">Connected</span>
    </div>
  </header>

  <div class="main-stage">
    <div class="card">
      <div class="card-title">YOUR CAMERA (CONTRIBUTION)</div>
      <div class="video-wrapper">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="tally-tag" id="localTally" style="color: #4ade80;">READY</div>
        <div class="stats-overlay" id="statsOverlay">RTT: 12ms | Loss: 0.0% | 1280x720 @ 30fps</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">PROGRAM RETURN MONITOR</div>
      <div class="video-wrapper">
        <video id="returnVideo" autoplay playsinline></video>
        <div class="tally-tag" style="background: #dc2626; color: white;">LIVE ON AIR</div>
      </div>
    </div>
  </div>

  <footer>
    <div class="controls">
      <select id="cameraSelect"><option>Default Camera</option></select>
      <select id="micSelect"><option>Default Microphone</option></select>
      <button id="btnMuteMic">Mute Mic</button>
      <button id="btnToggleCam">Stop Video</button>
    </div>
    <div>
      <button class="primary" id="btnReconnect">Reconnect</button>
    </div>
  </footer>

  <script>
    const token = "{{TOKEN}}";
    let ws = null;
    let localStream = null;
    let isMuted = false;
    let isCamOff = false;

    async function initMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        console.warn("Camera/mic access unavailable:", err);
      }
    }

    let pc = null;
    let statsTimer = null;
    let lastBytes = 0;
    let lastBytesAt = 0;

    function setBadge(text, color) {
      const b = document.getElementById('status-badge');
      b.textContent = text;
      b.style.background = color;
    }

    async function startPeer() {
      if (pc) { pc.close(); }
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      if (localStream) {
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      } else {
        pc.addTransceiver('video', { direction: 'sendonly' });
        pc.addTransceiver('audio', { direction: 'sendonly' });
      }
      pc.onicecandidate = (e) => {
        if (e.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'iceCandidate', candidate: e.candidate.toJSON() }));
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') setBadge('Live', '#059669');
        else if (pc.connectionState === 'failed') setBadge('Connection failed', '#dc2626');
        else setBadge('Connecting…', '#d97706');
      };
      pc.ontrack = (e) => {
        // Return feed (Program) from the producer, when offered.
        document.getElementById('returnVideo').srcObject = e.streams[0];
      };
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
    }

    async function collectStats() {
      if (!pc || !ws || ws.readyState !== WebSocket.OPEN) return;
      let rtt = 0, loss = 0, jitter = 0, bytes = 0, width = 0, height = 0, fps = 0;
      (await pc.getStats()).forEach(r => {
        if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.currentRoundTripTime != null) {
          rtt = r.currentRoundTripTime * 1000;
        }
        if (r.type === 'remote-inbound-rtp' && r.kind === 'video') {
          loss = (r.fractionLost || 0) * 100;
          jitter = (r.jitter || 0) * 1000;
        }
        if (r.type === 'outbound-rtp' && r.kind === 'video') {
          bytes = r.bytesSent || 0;
          width = r.frameWidth || 0;
          height = r.frameHeight || 0;
          fps = Math.round(r.framesPerSecond || 0);
        }
      });
      const now = performance.now();
      const kbps = lastBytesAt ? Math.round(((bytes - lastBytes) * 8) / (now - lastBytesAt)) : 0;
      lastBytes = bytes; lastBytesAt = now;
      ws.send(JSON.stringify({
        type: 'stats', rtt, packetLoss: loss, jitter, bitrate: Math.max(0, kbps),
        resolution: width && height ? `${width}x${height}` : '', fps
      }));
    }

    function connectWs() {
      if (ws) { try { ws.close(); } catch (_) {} }
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${window.location.host}/ws/guest/${token}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        setBadge('Connecting…', '#d97706');
        startPeer().catch(err => setBadge('Error: ' + err.message, '#dc2626'));
      };

      ws.onmessage = async (evt) => {
        const msg = JSON.parse(evt.data);
        try {
          if (msg.type === 'answer') {
            await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
          } else if (msg.type === 'iceCandidate') {
            await pc.addIceCandidate(msg.candidate);
          } else if (msg.type === 'error') {
            setBadge('Error: ' + msg.message, '#dc2626');
          }
        } catch (err) {
          console.warn('Signalling error:', err);
        }
      };

      ws.onclose = () => {
        if (pc) { pc.close(); pc = null; }
        setBadge('Disconnected', '#dc2626');
      };

      clearInterval(statsTimer);
      statsTimer = setInterval(() => collectStats().catch(() => {}), 2000);
    }

    document.getElementById('btnMuteMic').addEventListener('click', function() {
      isMuted = !isMuted;
      if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      }
      this.textContent = isMuted ? 'Unmute Mic' : 'Mute Mic';
      this.classList.toggle('active', isMuted);
    });

    document.getElementById('btnToggleCam').addEventListener('click', function() {
      isCamOff = !isCamOff;
      if (localStream) {
        localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      }
      this.textContent = isCamOff ? 'Start Video' : 'Stop Video';
      this.classList.toggle('active', isCamOff);
    });

    document.getElementById('btnReconnect').addEventListener('click', connectWs);

    initMedia();
    connectWs();
  </script>
</body>
</html>
