<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveStudio Pro — Tally Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background-color 0.15s ease; user-select: none; }
    .header { padding: 12px 16px; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    select { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 8px 12px; border-radius: 6px; font-size: 1rem; font-weight: 700; outline: none; }
    select option { background: #1e293b; color: white; }
    .center-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .cam-num { font-size: 8rem; font-weight: 900; line-height: 1; letter-spacing: -2px; }
    .status-text { font-size: 2.2rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-top: 12px; }
    .sub-text { font-size: 1rem; opacity: 0.8; margin-top: 8px; font-weight: 600; }
    body.program { background: #dc2626 !important; }
    body.preview { background: #16a34a !important; }
    body.idle { background: #334155 !important; }
  </style>
</head>
<body class="idle" id="tallyBody">
  <div class="header">
    <div style="font-weight:700; font-size:0.9rem;">LiveStudio Pro Tally</div>
    <select id="cameraSelect">
      <option value="1">Camera 1</option>
      <option value="2">Camera 2</option>
      <option value="3">Camera 3</option>
      <option value="4">Camera 4</option>
    </select>
  </div>

  <div class="center-stage">
    <div class="cam-num" id="camNum">1</div>
    <div class="status-text" id="statusText">STANDBY</div>
    <div class="sub-text" id="subText">WAITING FOR CUE</div>
  </div>

  <script>
    let selectedNum = 1;
    const body = document.getElementById('tallyBody');
    const camNum = document.getElementById('camNum');
    const statusText = document.getElementById('statusText');
    const subText = document.getElementById('subText');
    const cameraSelect = document.getElementById('cameraSelect');

    cameraSelect.addEventListener('change', (e) => {
      selectedNum = parseInt(e.target.value, 10);
      camNum.textContent = selectedNum;
    });

    function connectWs() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${window.location.host}/ws/tally`);

      ws.onmessage = (evt) => {
        try {
          const list = JSON.parse(evt.data);
          const item = list.find(x => x.tallyNumber === selectedNum);
          if (item) {
            body.className = item.state.toLowerCase();
            if (item.state === 'Program' || item.state === 'program') {
              statusText.textContent = 'ON AIR';
              subText.textContent = 'ACTIVE PROGRAM BUS';
            } else if (item.state === 'Preview' || item.state === 'preview') {
              statusText.textContent = 'PREVIEW';
              subText.textContent = 'CUED FOR NEXT TRANSITION';
            } else {
              statusText.textContent = 'STANDBY';
              subText.textContent = 'SAFE';
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWs, 2000);
      };
    }

    connectWs();
  </script>
</body>
</html>
